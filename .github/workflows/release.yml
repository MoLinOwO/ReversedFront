name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate public release contents
        run: node scripts/validate-release.cjs

      - name: Sync application version from tag
        run: node scripts/set-version.cjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libjavascriptcoregtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev

      - name: Install Tauri CLI
        run: npm ci

      # Mod 原始碼不放入公開 repository；已編譯的 bundle/data 直接隨應用程式打包。
      - name: Build Tauri application
        run: npx tauri build ${{ matrix.args }}

      - name: Rename Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $msiDir = "src-tauri/target/release/bundle/msi"

          $nsis = Get-ChildItem $nsisDir -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Move-Item $nsis.FullName (Join-Path $nsisDir "ReversedFront_$version.exe") -Force
          }

          $msi = Get-ChildItem $msiDir -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Move-Item $msi.FullName (Join-Path $msiDir "ReversedFront_$version.msi") -Force
          }

      - name: Rename Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          deb_file=$(find src-tauri/target -path '*/bundle/deb/*.deb' | head -n 1 || true)
          if [ -n "$deb_file" ]; then
            mv "$deb_file" "$(dirname "$deb_file")/ReversedFront_${RELEASE_TAG}.deb"
          fi

          appimage_file=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' | head -n 1 || true)
          if [ -n "$appimage_file" ]; then
            mv "$appimage_file" "$(dirname "$appimage_file")/ReversedFront_${RELEASE_TAG}.AppImage"
          fi

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          set -e
          dmg_file=$(find src-tauri/target -path '*/bundle/dmg/*.dmg' | head -n 1 || true)
          if [ -n "$dmg_file" ]; then
            mv "$dmg_file" "$(dirname "$dmg_file")/ReversedFront_${RELEASE_TAG}.dmg"
          fi

          app_file=$(find src-tauri/target -path '*/bundle/macos/*.app.tar.gz' | head -n 1 || true)
          if [ -n "$app_file" ]; then
            mv "$app_file" "$(dirname "$app_file")/ReversedFront_${RELEASE_TAG}.app.tar.gz"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz

  publish-update-manifest:
    needs: build-and-release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # fallback 更新只發布編譯後的 Mod bundle 與公開資料，不包含原始 JS。
      - name: Package compiled Mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mod-package/js mod-package/data
          cp web/mod/js/*.bundle.js mod-package/js/
          find web/mod/data -maxdepth 1 -type f \( \
            -name '*.yaml' -o -name '*.yml' -o -name '*.json' -o -name '*.svg' \
          \) -exec cp {} mod-package/data/ \;
          (cd mod-package && zip -qr "../ReversedFront_Mod_${RELEASE_TAG}.zip" js data)

      - name: Generate static update manifest
        shell: bash
        run: |
          set -euo pipefail
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          cat > update.json <<EOF
          {
            "tag_name": "${RELEASE_TAG}",
            "assets": [
              {"name": "ReversedFront_${RELEASE_TAG}.exe", "browser_download_url": "${release_base}/ReversedFront_${RELEASE_TAG}.exe"},
              {"name": "ReversedFront_${RELEASE_TAG}.msi", "browser_download_url": "${release_base}/ReversedFront_${RELEASE_TAG}.msi"},
              {"name": "ReversedFront_${RELEASE_TAG}.AppImage", "browser_download_url": "${release_base}/ReversedFront_${RELEASE_TAG}.AppImage"},
              {"name": "ReversedFront_${RELEASE_TAG}.deb", "browser_download_url": "${release_base}/ReversedFront_${RELEASE_TAG}.deb"},
              {"name": "ReversedFront_${RELEASE_TAG}.dmg", "browser_download_url": "${release_base}/ReversedFront_${RELEASE_TAG}.dmg"},
              {"name": "ReversedFront_${RELEASE_TAG}.app.tar.gz", "browser_download_url": "${release_base}/ReversedFront_${RELEASE_TAG}.app.tar.gz"}
            ],
            "mod": {
              "remoteRef": "${COMMIT_SHA}",
              "downloadUrl": "${release_base}/ReversedFront_Mod_${RELEASE_TAG}.zip",
              "filename": "ReversedFront_Mod_${RELEASE_TAG}.zip"
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('update.json', 'utf8'))"

      - name: Publish static update manifest and Mod archive
        uses: softprops/action-gh-release@v2
        with:
          files: |
            update.json
            ReversedFront_Mod_${{ env.RELEASE_TAG }}.zip
