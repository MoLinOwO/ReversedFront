name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            formats: app,dmg
          - platform: ubuntu-22.04
            target: ''
            formats: appimage,deb
          - platform: windows-latest
            target: ''
            formats: nsis,wix

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Tags must match checked-in versions; the release job never bumps them.
      - name: Validate public release contents and tag
        run: npm run validate:release

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # GPUI Kit 0.9 + lb-wry use Vulkan/X11 and WebKitGTK 4.1.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang cmake pkg-config mold \
            libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwebkit2gtk-4.1-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan1 librsvg2-dev patchelf libfuse2

      - name: Install build and installer tooling
        run: npm ci

      - name: Test release validation, native bridge, tooling and Rust backend
        run: npm test

      # The public checkout contains compiled Mod bundles/data, not Mod source.
      - name: Build GPUI application
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build

      - name: Build universal macOS GPUI application
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" npm run build -- --target aarch64-apple-darwin
          GITHUB_SHA="$(git rev-parse HEAD)" npm run build -- --target x86_64-apple-darwin
          mkdir -p desktop/target/universal-apple-darwin/release
          lipo -create \
            desktop/target/aarch64-apple-darwin/release/rf-desktop \
            desktop/target/x86_64-apple-darwin/release/rf-desktop \
            -output desktop/target/universal-apple-darwin/release/rf-desktop
          lipo desktop/target/universal-apple-darwin/release/rf-desktop -verify_arch arm64 x86_64

      # Cargo builds GPUI; the standalone packager creates installers.
      # Our updater selects the actual published platform installers.
      - name: Bundle existing executable
        run: |
          node -e "const fs=require('fs'); for (const dir of ['desktop/target/packages/release','desktop/target/release-assets']) fs.rmSync(dir,{recursive:true,force:true});"
          node scripts/validate-release.cjs --resources
          node scripts/bundle.cjs --formats "${{ matrix.formats }}" ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Collect named installers
        run: node scripts/release-artifacts.cjs stage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: ReversedFront ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          fail_on_unmatched_files: true
          files: desktop/target/release-assets/*

  publish-update-manifest:
    needs: build-and-release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate public release contents and tag
        run: npm run validate:release

      # The same allowlist excludes config/accounts/DBs and includes chunk licenses.
      - name: Package compiled Mod
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-artifacts.cjs mod
          (cd desktop/target/release-mod && zip -qr "../release-assets-mod.zip" js data)
          mv desktop/target/release-assets-mod.zip "ReversedFront_Mod_$RELEASE_TAG.zip"

      # Require published platform installers; include app archives only when present.
      - name: Generate static update manifest from published installers
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            | COMMIT_SHA="$(git rev-parse HEAD)" node scripts/release-artifacts.cjs manifest

      - name: Publish static update manifest and Mod archive
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: ReversedFront ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          fail_on_unmatched_files: true
          files: |
            update.json
            ReversedFront_Mod_${{ env.RELEASE_TAG }}.zip

      - name: Publish complete release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
