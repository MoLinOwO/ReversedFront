[package]
name = "rf-desktop"
version = "3.3.1"
description = "Reversed Front Desktop App"
authors = ["you"]
edition = "2021"

[[bin]]
name = "rf-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:gpui-webview", "dep:wry", "dep:gtk"]

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, optional = true }
gpui-webview = { version = "=0.9.0", optional = true }
wry = { version = "=0.53.3", package = "lb-wry", optional = true }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1.0"
regex = "1.10"
urlencoding = "2.1"
warp = "0.3"
num_cpus = "1.0"
directories = "6.0.0"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }

# 編譯速度優化
[profile.dev]
incremental = true
codegen-units = 256

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true
